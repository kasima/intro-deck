<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Kasima: The Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game"></div>

<div id="controls" aria-hidden="true">
  <div class="pad left">
    <button data-key="left" aria-label="Left">◀</button>
    <button data-key="right" aria-label="Right">▶</button>
  </div>
  <div class="pad right">
    <button data-key="jump" class="jump" aria-label="Jump">▲</button>
  </div>
</div>

<div id="rotate">
  <div>↻</div>
  <p>Rotate your phone to play</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
